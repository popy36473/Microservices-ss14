spring:
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                format_sql: true
    application:
        name: identity-service
    datasource:
        driver-class-name: org.postgresql.Driver
        password: 110905
        username: postgres
        url: jdbc:postgresql://localhost:5432/identity_db
server:
    port: 8081
